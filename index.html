<style>
/* Layout: full-bleed 3D clay city; glass HUD in corners; one floating card (left on desktop, bottom sheet on phone); big step button bottom-center */
:root{
  --bg1:#fffdf9; --bg2:#edddcf;
  --card:rgba(255,250,245,.94); --card-solid:#fffaf5; --ink:#211d1d; --muted:#6e625b; --line:#ecdccd;
  --coral:#db6a41; --coral-ink:#fff; --yellow:#fcea8b; --cream:#fff8f4; --stone:#c5b5a7;
  --ok:#3f8f5a; --ok-bg:#e4f3e6; --bad:#b9573c; --bad-bg:#fbe7df; --flag:#e6b422;
  --shadow:0 1px 2px #4a2a1412,0 8px 24px #4a2a141c,0 24px 60px #4a2a1414;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,monospace;
  --num:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --card:rgba(40,34,32,.93); --card-solid:#2a2422; --ink:#f6ece4; --muted:#c7b6aa; --line:#4a3d37;
  --cream:#3a302c; --ok-bg:#24402c; --bad-bg:#4a2b22; --yellow:#7a6a2a; color-scheme:dark }}
:root[data-theme="dark"]{ --card:rgba(40,34,32,.93); --card-solid:#2a2422; --ink:#f6ece4; --muted:#c7b6aa; --line:#4a3d37;
  --cream:#3a302c; --ok-bg:#24402c; --bad-bg:#4a2b22; --yellow:#7a6a2a; color-scheme:dark }
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);background:radial-gradient(120% 90% at 50% 30%,var(--bg1),var(--bg2));background-color:var(--bg2)}
#scene{position:fixed;inset:0}
#scene canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
button{font-family:inherit}
.btn{min-height:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--card-solid);color:var(--ink);padding:0 16px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:#fcea8b;color:#211d1d}
.btn:active{background:#211d1d;color:#fff}
.btn:focus-visible,.opt:focus-visible,.ib:focus-visible,.go:focus-visible,.look:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{background:#fcea8b;color:#211d1d;border-color:#e3c95a}
.glass{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.hidden{display:none!important}
.eyebrow{font:700 10px/1.4 var(--mono);letter-spacing:2px;color:var(--coral);text-transform:uppercase}
/* title card */
#titleCard{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));border-radius:18px;padding:12px 16px;max-width:300px}
#titleCard h1{margin:2px 0 4px;font-size:19px;letter-spacing:.5px}
#titleCard .where{font-size:14px;font-weight:700}
#titleCard .bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
#titleCard .bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .4s}
/* top right */
#tr{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.chip{border-radius:999px;background:var(--card-solid);box-shadow:0 2px 8px #4a2a1414;padding:0 14px;height:44px;display:flex;align-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.ib{width:44px;height:44px;border-radius:999px;border:none;background:var(--card-solid);color:var(--ink);box-shadow:0 2px 8px #4a2a1414;font-size:18px;cursor:pointer}
.ib:hover{background:#fcea8b;color:#211d1d}
/* go button */
#goWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5}
.go{min-height:64px;min-width:240px;border-radius:999px;border:none;background:var(--coral);color:#fff;display:flex;align-items:center;gap:12px;padding:0 26px 0 20px;box-shadow:0 6px 0 #a34e34,0 14px 30px #4a2a1440;cursor:pointer;text-align:left}
.go:hover{filter:brightness(1.06)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #a34e34,0 8px 18px #4a2a1440}
.go:disabled{opacity:.55;cursor:default}
.go .gi{font-size:26px}
.go b{display:block;font-size:20px;letter-spacing:1px}
.go small{display:block;font-size:12.5px;opacity:.92;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.cardOpen #goWrap{opacity:0;pointer-events:none}
/* card */
#card{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(132px + env(safe-area-inset-top,0px));width:380px;max-height:calc(100% - 160px);overflow:auto;border-radius:22px;padding:20px 22px 22px;z-index:6;transform:translateX(-420px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#card.open{transform:none;opacity:1}
#card h2{margin:6px 0 10px;font-size:22px;line-height:1.35;text-wrap:balance}
#card .lead{font-size:16px;line-height:1.75;margin:0 0 12px}
.facts{display:grid;gap:8px;margin:0 0 12px}
.fact{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14.5px;line-height:1.5}
.fact em{font-family:var(--num);font-style:italic;font-weight:700;font-size:19px;color:var(--coral)}
.ref{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1}
.qtext{font-size:22px!important}
.opts{display:grid;gap:10px;margin:8px 0 10px}
.opt{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card-solid);color:var(--ink);font-size:17px;font-weight:600;text-align:left;display:flex;gap:12px;align-items:center;padding:8px 14px;cursor:pointer;transition:background .15s,opacity .2s}
.opt:hover:not(:disabled){background:#fcea8b;color:#211d1d}
.opt kbd{font:700 12px var(--mono);border:1.5px solid currentColor;border-radius:6px;padding:2px 6px;opacity:.6}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.ok kbd{opacity:1;color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);opacity:.6;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fb{font-size:15px;line-height:1.65;min-height:4px}
.fb .msg{border-radius:12px;padding:10px 12px;margin-top:4px}
.fb .msg.ok{background:var(--ok-bg)}
.fb .msg.hint{background:var(--cream);border:1px dashed var(--stone)}
.fb .msg.bad{background:var(--bad-bg)}
.flip{animation:flip .6s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{0%{transform:perspective(800px) rotateY(90deg)}100%{transform:none}}
.ring{display:flex;gap:16px;align-items:center;margin:8px 0 14px}
.badge{font-size:44px;line-height:1}
.statrow{display:flex;gap:10px;margin:10px 0}
.stat{flex:1;background:var(--cream);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--num);font-style:italic;font-size:28px;color:var(--coral)}
.stat span{font-size:12px;color:var(--muted)}
.rlist{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.7}
/* overlays */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,25,18,.28);z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--card-solid);border-radius:22px;box-shadow:var(--shadow);padding:24px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto}
.panel h2{margin:4px 0 6px;font-size:26px}
.panel p{line-height:1.7}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.look{border:2px solid var(--line);background:var(--cream);color:var(--ink);border-radius:14px;padding:10px 4px;cursor:pointer;font-size:13px;font-weight:700;min-height:72px}
.look span{display:block;font-size:28px}
.look[aria-pressed="true"]{border-color:var(--coral);background:#fcea8b;color:#211d1d}
label.f{display:block;font-weight:700;font-size:14px;margin:6px 0}
input[type=text]{width:100%;box-sizing:border-box;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);font:600 17px var(--font);padding:0 12px}
.steps{display:grid;gap:10px;margin:12px 0 16px}
.steps div{display:flex;gap:12px;align-items:center;background:var(--cream);border-radius:12px;padding:10px 12px;font-size:15.5px;line-height:1.5}
.steps b{font-family:var(--num);font-style:italic;font-size:26px;color:var(--coral);min-width:22px}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px;margin:10px 0}
.prog .pb{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--coral)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.small{font-size:12.5px;color:var(--muted);line-height:1.6}
/* certificate */
#cert .panel{border:6px double #c99a52;text-align:center;width:min(560px,100%)}
#cert h2{font-size:30px;letter-spacing:4px}
#cert .who{font-size:28px;font-weight:800;color:var(--coral);margin:8px 0}
#cert table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0;text-align:left}
#cert td{border-bottom:1px solid var(--line);padding:5px 4px;font-variant-numeric:tabular-nums}
.lb{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.lb th{font:700 11px var(--mono);letter-spacing:1px;color:var(--muted);text-align:left;padding:4px;border-bottom:2px solid var(--line)}
.lb td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lb td.rk{font-family:var(--num);font-style:italic;font-weight:700;font-size:18px;color:var(--coral);width:36px}
.lb tr.me td{background:#fff3b8;color:#211d1d}
.lb .num{text-align:right}
/* labels */
.ilabel{border-radius:999px;background:rgba(255,248,244,.92);color:#211d1d;font:700 12.5px var(--font);padding:4px 11px;box-shadow:0 2px 8px #4a2a1420;white-space:nowrap;transition:opacity .3s}
.ilabel.cur{background:#211d1d;color:#fff}
.ilabel.dim{opacity:.55}
.ilabel.lock{background:#e9e1d9;color:#7a6d64}
.tlabel{font:800 12px var(--font);color:#211d1d;background:rgba(255,255,255,.9);border-radius:999px;padding:1px 7px;box-shadow:0 1px 4px #4a2a1420;white-space:nowrap}
.tlabel.done{background:#fff3b8}
.tlabel.rev{background:#ffd75a}
.tlabel.next{background:var(--coral);color:#fff}
.gsign{font:800 12px var(--font);background:#db6a41;color:#fff;border-radius:8px;padding:3px 9px;box-shadow:0 2px 6px #4a2a1430;white-space:nowrap}
.gsign.okd{background:#3f8f5a}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#211d1d;color:#fff;border-radius:999px;padding:10px 20px;font-weight:700;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;z-index:40;background:radial-gradient(120% 90% at 50% 30%,var(--bg1),var(--bg2));color:#211d1d}
#loading .big{font-size:34px;font-weight:900;letter-spacing:3px}
#loading .sub{margin-top:10px;font-size:16px;color:#6e625b}
#loading .err{margin-top:14px;color:#b9573c;font-weight:700;max-width:420px}
body.big #card h2{font-size:26px}
body.big #card .lead,body.big .opt{font-size:20px}
body.big .qtext{font-size:26px!important}
@media (max-width:800px){
  #titleCard{top:calc(66px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);padding:8px 12px}
  #titleCard h1{font-size:15px}
  #titleCard .where{font-size:12.5px}
  #tr{gap:6px}
  .chip{height:40px;padding:0 10px;font-size:14px}
  .ib{width:40px;height:40px;font-size:16px}
  #card{left:0;right:0;bottom:0;top:auto;width:auto;max-height:none;height:46%;border-radius:22px 22px 0 0;transform:translateY(105%);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  #card.open{transform:none}
  #card::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
  #card.tall{height:auto;max-height:68%}
  .qtext{font-size:19px!important}
  .opt{font-size:16px}
  .go{min-width:220px}
}
@media (prefers-reduced-motion:reduce){ #card,.opt,.flip,#toast{transition:none!important;animation:none!important} }
@media print{ body>*:not(#cert){display:none!important} #cert{position:static;background:none;display:block!important} #cert .row{display:none} }
</style>

      { id:'3-7', type:'quiz', model:'scroll', ref:'會考學力診斷第 9 題（p.39）', title:'阿哲的左榜右榜',
        q:{ q:'阿哲原為南宋政權下的廣西壯族人，元帝國南下滅宋後便受蒙古人統治。一天他在報名科舉考試時，發現考試分為「左榜」與「右榜」，而壯族名列「左榜」，不僅題目較難，錄取名額也較少。根據當時的時代背景判斷，阿哲應是屬於哪一個種族等級？', options:['蒙古人','漢人','色目人','南人'], answer:3,
            hint:'原本受「南宋」統治的人，被分在哪一等？', why:'講義 p.33：南人是原受南宋統治的漢人及南方各族。' } },

        q:{ q:'翰翰公司出了一款以中國歷史為背景的遊戲，劇情是：「成吉思汗雄鷹般目光炯炯注視著西方，親自領軍攻陷花剌子模新都撒馬爾罕，其後更南征呼羅珊，北討俄羅斯，迦勒迦河一役大敗突厥俄羅斯聯軍，俄羅斯諸王公幾乎全數命喪於此。」該遊戲的名稱最可能為何者？', options:['《契丹王朝》','《女真風雲》','《蒙古帝國》','《西夏傳奇》'], answer:2,
            hint:'成吉思汗是哪一族的領袖？', why:'成吉思汗（鐵木真）建立蒙古國並發動西征（講義 p.32）。' } }
    ], gatePool:[
      { id:'g3-1', ref:'段考複習評量第 9 題（p.58）', q:{ q:'歌曲〈成吉思汗〉中有歌詞：「1162 某個深夜，握著一塊血，□進世界，註定立大業。……種族、國界被他超越，忠誠是手中最硬的鐵。△打開一個時代，征服了所有，看你拜不拜。」上述的□、△應分別填入何者最為適當？', options:['朱元璋、大明','趙匡胤、大宋','康熙、大清','鐵木真、蒙古'], answer:3, hint:'', why:'成吉思汗就是鐵木真，他建立了蒙古國（講義 p.32）。' } },
      { id:'g3-2', ref:'學習即時通 3-1 第 4 題（p.33）', q:{ q:'種族歧視最易引發政治、社會不安，中國歷史上哪一朝代因為實行差別待遇的種族政策而導致衰亂？', options:['北宋','南宋','元代','明代'], answer:2, hint:'', why:'講義 p.33：元朝實施種族政策，元世祖之後民變紛起，元朝因而瓦解。' } },

      { id:'4-2', type:'lesson', model:'market', ref:'會考學力診斷第 2 題（p.38）', title:'坊市瓦解與夜市',
        text:'唐代中期以前實行「坊市制度」，住宅區（坊）和商業區（市）分開，還有「夜禁」。到了宋代，坊市制度瓦解，商店遍布城內各處，商人可以隨時交易，夜市因此興旺。',
        points:['唐：坊市分離、夜禁','宋：坊市制度瓦解','夜市興盛'],

        text:'張擇端的《清明上河圖》描繪汴京的城市生活，反映北宋的繁華。宋元也因商業需要出現紙幣：北宋四川商人發行的「交子」是世界上最早正式發行的鈔票；元代政府發行「寶鈔」通行全國。',
        points:['《清明上河圖》畫的是北宋汴京','交子：世界最早的鈔票','元代寶鈔通行全國'],

        text:'宋代國際貿易以海路為主，在泉州、廣州等港口設市舶司管理，稅收是政府的重要收入。市舶司始設於唐、興盛於宋元，負責管理商船、檢查入港貨物和徵稅，功能類似今日的海關。',

            hint:'名字裡有「舶」，就是船。', why:'講義 p.34：市舶司負責管理商船、檢查入港貨物與徵稅，類似今日海關。' } },
      { id:'4-5', type:'lesson', model:'post', ref:'學習即時通 3-2 第 5 題（p.35）', title:'驛站',
        text:'元代海上貿易依舊興盛，而蒙古帝國的擴張更打通了東西陸路貿易。各地廣設「驛站」，提供信使、官員與旅人歇息，促進歐亞的貿易與貨物流通。',

async function hop(from,to){ const yaw=Math.atan2(to.x-from.x,to.z-from.z); player.g.rotation.y=yaw; sfx.step();

async function runGate(I){ const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(crand()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

$('#srcLine').textContent='內容來源：'+DATA.meta.source;
$('#looks').innerHTML=LOOKS.map(l=>`<button class="look" data-look="${l.id}" aria-pressed="${l.id===S.look}"><span>${l.icon}</span>${l.name}</button>`).join('');
$('#looks').addEventListener('click',e=>{ const b=e.target.closest('.look'); if(!b) return; S.look=b.dataset.look; document.querySelectorAll('.look').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
if(saved) $('#btnContinue').classList.remove('hidden');
function begin(){ $('#start').classList.add('hidden'); $('#titleCard').classList.remove('hidden'); $('#tr').classList.remove('hidden'); $('#goWrap').classList.remove('hidden');
  if(player) scene.remove(player.g); player=makePlayer(S.look,S.name); applyWorld(); applyTime(S.finished?1260:curI().def.time); placePlayer(); follow=true; updateLabels();
  if(!S.seenHelp) $('#help').classList.remove('hidden'); else $('#go').focus(); }
$('#btnStart').addEventListener('click',()=>{ ac(); const name=($('#nameIn').value||'').trim().slice(0,10); if(!name){ toast('先輸入你的名字'); $('#nameIn').focus(); return; } const look=S.look; const keepMuted=S.muted;
  const pid=(saved&&saved.name===name&&saved.pid)?saved.pid:newPid();
  Object.assign(S,{pid,name,look,isl:0,slot:0,unlocked:1,tiles:{},built:{},stars:0,times:{},answered:0,firstTry:0,finished:false,started:true,seenHelp:saved?.seenHelp||false,muted:keepMuted}); save(); begin(); });
$('#btnContinue').addEventListener('click',()=>{ ac(); Object.assign(S,saved,{started:true}); if(!S.pid) S.pid=newPid(); if(!S.name) S.name='小探險家'; save(); begin(); });
$('#btnHelpOk').addEventListener('click',()=>{ $('#help').classList.add('hidden'); S.seenHelp=true; save(); $('#go').focus(); });
$('#btnHelp').addEventListener('click',()=>$('#help').classList.remove('hidden'));
$('#btnPano').addEventListener('click',()=>goPano());
$('#btnMute').addEventListener('click',()=>{ S.muted=!S.muted; save(); updateLabels(); });
$('#go').addEventListener('click',go);
function panelHTML(){ const rows=G.map(I=>{ const d=I.tiles.filter(isDone).length; return `<span>${String(I.gi+1).padStart(2,'0')} ${I.gi<S.unlocked?esc(I.def.name):'？'}</span><span class="pb"><i style="width:${Math.round(d/I.tiles.length*100)}%"></i></span><span>${d}/${I.tiles.length}</span>`; }).join('');
  const rev=allTiles.filter(T=>tState(T)==='review'); const acc=S.answered?Math.round(S.firstTry/S.answered*100):0;
  return `<div class="eyebrow">家長／老師面板</div><h2>學習進度</h2><div class="statrow"><div class="stat"><b>${S.stars}</b><span>星星</span></div><div class="stat"><b>${acc}%</b><span>第一次就答對</span></div><div class="stat"><b>${rev.length}</b><span>待複習</span></div></div>
  <div class="prog">${rows}</div>
  <h3 style="margin:14px 0 6px">待複習</h3>${rev.length?rev.map(T=>`<div class="row" style="align-items:center;margin:4px 0"><span style="flex:1">🚩 第 ${T.I.gi+1} 島 ${NUMS[T.ti]} ${esc(T.def.title)}</span><button class="btn" data-practice="${T.def.id}">練習</button></div>`).join(''):'<p class="small">目前沒有待複習的題目。</p>'}
  <div class="row"><button class="btn" id="pBig">${S.big?'✓ ':''}大字模式</button><button class="btn" id="pMute">${S.muted?'🔇 已靜音':'🔊 聲音開啟'}</button><button class="btn" id="pReset">重設進度</button></div>
  <p class="small">內容來源：${esc(DATA.meta.source)}。對象：${esc(DATA.meta.audience)}。進度只存在這台裝置的瀏覽器裡。</p>
  <div class="row"><button class="btn primary" id="pClose" style="flex:1">關閉</button></div>`; }
function openPanel(){ $('#panelBody').innerHTML=panelHTML(); $('#panel').classList.remove('hidden'); $('#pClose').focus(); }
$('#btnPanel').addEventListener('click',openPanel);
$('#panel').addEventListener('click',async e=>{ const t=e.target;
  if(t.id==='pClose'||t===$('#panel')) $('#panel').classList.add('hidden');
  if(t.id==='pBig'){ S.big=!S.big; document.body.classList.toggle('big',S.big); save(); openPanel(); }
  if(t.id==='pMute'){ S.muted=!S.muted; save(); updateLabels(); openPanel(); }
  if(t.id==='pReset'){ $('#confirmBody').innerHTML=`<h2>重設全部進度？</h2><p>星星、蓋好的模型和待複習清單都會清掉，回到第 1 島重新開始。這個動作不能復原。</p><div class="row"><button class="btn" id="cNo" style="flex:1">取消</button><button class="btn primary" id="cYes" style="flex:1">重設</button></div>`; $('#confirm').classList.remove('hidden'); $('#cNo').focus(); }
  const pid=t.dataset?.practice; if(pid&&!busy&&!cardKind){ $('#panel').classList.add('hidden'); const T=allTiles.find(x=>x.def.id===pid); busy=true;
    try{ const r=await quizCard(T,'practice'); if(r>0){ S.tiles[pid]='done'; S.stars++; buildTile(T); tileColor(T,T.I.gi<S.unlocked?T.baseCol:_c.copy(T.baseCol).lerp(lockCol,.6)); } save(); updateLabels(); await waitFor('next'); closeCard(); } finally{ busy=false; } } });
$('#confirm').addEventListener('click',e=>{ if(e.target.id==='cNo'||e.target===$('#confirm')) $('#confirm').classList.add('hidden');
  if(e.target.id==='cYes'){ try{ localStorage.removeItem(lsKey); }catch(_){} location.reload(); } });
function showCert(){ const rev=allTiles.filter(T=>tState(T)==='review'); const fmt=iso=>{ if(!iso) return '—'; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  $('#certBody').innerHTML=`<div class="eyebrow">${esc(DATA.meta.subject)}</div><h2>結業證書</h2><div class="who">${esc(S.name)}</div>
    <p>完成了「${esc(DATA.meta.title)}」全部 ${G.length} 座島，<br>共獲得 <b style="font-family:var(--num);font-style:italic;font-size:22px;color:var(--coral)">${S.stars}</b> 顆星星。</p>
    <table>${G.map(I=>`<tr><td>${String(I.gi+1).padStart(2,'0')} ${esc(I.def.name)}</td><td style="text-align:right">${fmt(S.times[I.gi])}</td></tr>`).join('')}</table>
    ${rev.length?`<p class="small" style="text-align:left">待複習：${rev.map(T=>esc(T.def.title)).join('、')}</p>`:'<p class="small">沒有待複習的題目，全部過關！</p>'}
    <p class="small">內容來源：${esc(DATA.meta.source)}</p>
    <div class="row"><button class="btn" id="ceAgain" style="flex:1">再玩一次（保留模型）</button><button class="btn" id="ceReset" style="flex:1">全部重來</button><button class="btn primary" id="ceClose" style="flex:1">關閉</button></div>`;
  $('#cert').classList.remove('hidden'); $('#ceClose').focus(); }
$('#cert').addEventListener('click',e=>{ const id=e.target.id; if(id==='ceClose') $('#cert').classList.add('hidden');
  if(id==='ceReset'){ $('#cert').classList.add('hidden'); $('#pReset')?.click(); $('#confirmBody').innerHTML=`<h2>全部重來？</h2><p>星星和模型都會清掉，回到第 1 島。</p><div class="row"><button class="btn" id="cNo" style="flex:1">取消</button><button class="btn primary" id="cYes" style="flex:1">重來</button></div>`; $('#confirm').classList.remove('hidden'); }
  if(id==='ceAgain'){ $('#cert').classList.add('hidden'); Object.assign(S,{isl:0,slot:0,unlocked:1,tiles:{},stars:0,times:{},answered:0,firstTry:0,finished:false}); save(); applyWorld(); applyTime(G[0].def.time); placePlayer(); follow=true; updateLabels(); } });
// ---------------- leaderboard (Google Apps Script web app)
const LB=(DATA.meta.leaderboard||'').trim();
function newPid(){ try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return Array.from({length:4},()=>Math.floor(crand()*1e9).toString(36)).join('-'); }
function scorePayload(){ return {id:S.pid,name:S.name,stars:S.stars,islands:S.finished?G.length:S.unlocked-1,accuracy:S.answered?Math.round(S.firstTry/S.answered*100):0,finished:S.finished}; }
async function submitScore(){ if(!LB||!S.pid||!S.name) return; const body=JSON.stringify(scorePayload());
  try{ await fetch(LB,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}); }
  catch(e){ try{ await fetch(LB,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body}); }catch(_){} } }
async function openBoard(){ const B=$('#boardBody'); $('#board').classList.remove('hidden');
  const head=`<div class="eyebrow">${esc(DATA.meta.title)}</div><h2>🏆 排行榜</h2><p class="small">先比過關的島數，再比星星，最後比第一次就答對的比例。</p>`;
  const foot=`<div class="row"><button class="btn" id="bRefresh" style="flex:1">重新整理</button><button class="btn primary" id="bClose" style="flex:1">關閉</button></div>`;
  if(!LB){ B.innerHTML=head+`<p class="lead">排行榜還沒設定好。請家長依照說明部署 Google 試算表，再把網址填進 DATA.meta.leaderboard。</p>`+foot; $('#bClose').focus(); return; }
  B.innerHTML=head+`<p class="small">讀取中…</p>`+foot; $('#bClose').focus();
  try{ if(S.started) await submitScore(); const r=await fetch(LB+(LB.includes('?')?'&':'?')+'t='+Date.now()); const rows=await r.json(); const mine=(S.pid||'').slice(0,6);
    const tbl=rows.length?`<table class="lb"><thead><tr><th>名次</th><th>名字</th><th class="num">島</th><th class="num">⭐</th><th class="num">答對率</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${x.id===mine?'me':''}"><td class="rk">${i+1}</td><td>${esc(x.name)}${x.finished?' 🎓':''}</td><td class="num">${x.islands}/${G.length}</td><td class="num">${x.stars}</td><td class="num">${x.accuracy}%</td></tr>`).join('')}</tbody></table>`:'<p class="lead">還沒有人上榜，快來當第一名！</p>';
    B.innerHTML=head+tbl+foot; }
  catch(e){ B.innerHTML=head+`<p class="lead">排行榜暫時連不上，請檢查網路後按「重新整理」。</p>`+foot; }
  $('#bClose').focus(); }
$('#btnBoard').addEventListener('click',openBoard); $('#btnBoard2').addEventListener('click',openBoard);
$('#board').addEventListener('click',e=>{ if(e.target.id==='bClose'||e.target===$('#board')) $('#board').classList.add('hidden'); if(e.target.id==='bRefresh') openBoard(); });
let toastT=0; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// ---------------- keyboard
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; const overlayOpen=[...document.querySelectorAll('.overlay')].some(o=>!o.classList.contains('hidden'));
  if(e.key==='Escape'){ if(overlayOpen){ document.querySelectorAll('.overlay').forEach(o=>{ if(o.id!=='start') o.classList.add('hidden'); }); return; } if(cardKind==='info'){ const p=card.querySelector('[data-primary]'); p?.click(); } return; }
  if(overlayOpen) return;
  if(/^[1-4]$/.test(e.key)&&cardKind){ const b=[...card.querySelectorAll('.opt')][+e.key-1]; if(b&&!b.disabled){ b.click(); e.preventDefault(); } return; }
  if(e.key===' '||e.key==='Enter'){ if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&e.key==='Enter') return; e.preventDefault(); if(cardKind){ card.querySelector('[data-primary]')?.click(); } else go(); return; }
  const rot={ArrowLeft:[.12,0],ArrowRight:[-.12,0],ArrowUp:[0,-.08],ArrowDown:[0,.08]}[e.key];
  if(rot){ e.preventDefault(); follow=false; fly=null; const off=camera.position.clone().sub(controls.target); const sp=new THREE.Spherical().setFromVector3(off); sp.theta+=rot[0]; sp.phi=clamp(sp.phi+rot[1],controls.minPolarAngle,controls.maxPolarAngle); off.setFromSpherical(sp); camera.position.copy(controls.target).add(off); } });

// ---------------- resize & loop
function resize(){ const w=host.clientWidth||innerWidth, h=host.clientHeight||innerHeight; renderer.setSize(w,h); labelRenderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host); resize();
let clockT=0; const _ft=new THREE.Vector3(), _fc=new THREE.Vector3();
function step(dt){ clockT+=dt; updateTweens(dt);
  if(!RM){ waterU.uTime.value=clockT; for(const c of clouds){ c.position.x+=c.userData.v*dt; if(c.position.x>95) c.position.x=-95; } }
  if(fly){ fly.t+=dt; const k=easeIO(Math.min(1,fly.t/fly.dur)); camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(fly.t>=fly.dur) fly=null; }
  else if(follow&&player){ _ft.copy(player.g.position); if(!isMobile&&cardKind) _ft.x-=1.2; if(isMobile&&cardKind) _ft.z+=1.0; _fc.copy(_ft).add(followOff); const a=1-Math.exp(-dt*4); controls.target.lerp(_ft,a); camera.position.lerp(_fc,a); }
  if(player&&!busy&&!RM){ const b=Math.sin(clockT*3)*.012; player.inner.position.y=b; player.legL.rotation.x=player.legR.rotation.x=0; player.armL.rotation.z=player.armR.rotation.z=0; }
  updateWalkers(dt,clockT); updateConf(dt); controls.update(); sky.position.copy(camera.position);
  const camD=camera.position.distanceTo(controls.target); for(const m of small.meshes) m.visible=camD<26; }
function render(){ renderer.render(scene,camera); labelRenderer.render(scene,camera); }
let last=performance.now();
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(.08,Math.max(0,(now-last)/1000)); last=now; step(dt); render(); }

// ---------------- init
applyWorld(); applyTime(saved?.finished?1260:G[saved?.isl||0].def.time);
{ const p=panoPose(); camera.position.copy(p.pos); controls.target.copy(p.target); controls.update(); }
step(0); render(); requestAnimationFrame(frame);
$('#loading').classList.add('hidden'); $('#start').classList.remove('hidden');
if(saved){ $('#nameIn').value=saved.name; S.look=saved.look; document.querySelectorAll('.look').forEach(x=>x.setAttribute('aria-pressed',x.dataset.look===S.look)); }
if(S.big) document.body.classList.add('big');
window.__islandReady=true;
window.__islandSelfTest=()=>({ mode:DATA.mode, islands:G.length, decorIslands:all.length-G.length, items:allTiles.length, questions:allTiles.filter(T=>T.def.q).length, flows:0, walkers:walkers.length,
  drawCalls:renderer.info.render.calls, triangles:renderer.info.render.triangles, started:S.started, isl:S.isl, slot:S.slot, unlocked:S.unlocked, stars:S.stars, card:cardKind });
window.__islandDebug={
  tick(ms=1000){ const n=Math.ceil(ms/16); for(let i=0;i<n;i++) step(1/60); render(); return {isl:S.isl,slot:S.slot,card:cardKind,tweens:tweens.length}; },
  start(name='測試'){ $('#nameIn').value=name; $('#btnStart').click(); $('#btnHelpOk').click(); return true; },
  step(){ go(); return true; }, roll(){ go(); return true; },
  answer(i){ const b=[...card.querySelectorAll('.opt')][i]; if(b&&!b.disabled){ b.click(); return b.textContent; } return null; },
  correct(){ const T=[...allTiles,...G.flatMap(I=>(I.def.gatePool||[]).map(d=>({def:d})))].find(x=>card.innerHTML.includes(esc(x.def.q?.q||'§§'))); if(!T) return null; const b=card.querySelector(`[data-act="opt${T.def.q.answer}"]`); b?.click(); return T.def.id; },
  wrong(){ const T=allTiles.find(x=>card.innerHTML.includes(esc(x.def.q?.q||'§§'))); if(!T) return null; const b=[...card.querySelectorAll('.opt')].find(x=>x.dataset.act!=='opt'+T.def.q.answer&&!x.disabled); b?.click(); return b?.textContent; },
  next(){ const b=card.querySelector('[data-primary]'); b?.click(); return !!b; },
  unlockAll(){ S.unlocked=G.length; save(); applyWorld(); return true; },
  state(){ return JSON.parse(JSON.stringify(S)); }
};
}
</script>
